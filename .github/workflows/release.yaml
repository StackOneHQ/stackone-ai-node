name: Release Package
on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please
        with:
          release-type: node

  publish-package:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created  }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Outside the nix shell: devEngines pins the exact Node version, and nixpkgs does not ship
      # it yet, so `nix develop` would pack on an older Node that npm refuses (EBADDEVENGINES).
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js for npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          registry-url: 'https://registry.npmjs.org'
          node-version-file: package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📦 Pack package
        run: pnpm pack

      - name: 🚀 Publish package
        shell: bash
        run: |
          PACKAGE_TGZ=$(ls *.tgz | head -n 1)
          echo "Publishing package: $PACKAGE_TGZ"
          npm publish "$PACKAGE_TGZ" --access public
