name: Dry Run Publish Package with pkg.pr.new

on:
  pull_request:
  push:

jobs:
  dry-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Outside the nix shell: devEngines pins the exact Node version, and nixpkgs does not ship
      # it yet, so `nix develop` would pack on an older Node that npm refuses (EBADDEVENGINES).
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🚀 Dry Run Publish Package
        run: pnpm dlx pkg-pr-new publish --pnpm
