name: Dry Run Publish Package with pkg.pr.new

on:
  pull_request:
  push:

jobs:
  dry-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Outside the nix shell: devEngines pins the exact Node version, and nixpkgs does not ship
      # it yet, so `nix develop` would pack on an older Node that npm refuses (EBADDEVENGINES).
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🚀 Dry Run Publish Package
        run: pnpm dlx pkg-pr-new publish --pnpm
